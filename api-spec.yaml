"openapi": "3.1.1"
"info":
  "title": "NetScope API"
  "description": "NetScope vietų, įrenginių, klientų ir paskyrų API. Svečias gali registruotis ir prisijungti; prisijungęs naudotojas naudoja JWT HttpOnly slapuke. Pavyzdžių UUID ir datos yra iliustraciniai."
  "version": "1.0.0"
"servers":
  -
    "url": "http://localhost:5220"
    "description": "Vietinė versija"
"paths":
  "/health":
    "get":
      "tags":
        - "NetScope.Server"
      "summary": "API ir duomenų bazės pasiekiamumas"
      "responses":
        "200":
          "description": "Sėkminga užklausa."
          "content":
            "application/json":
              "example":
                "status": "healthy"
        "503":
          "description": "Duomenų bazė nepasiekiama."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/ProblemDetails"
              "example":
                "title": "Duomenų bazė nepasiekiama."
                "status": 503
      "operationId": "getHealth"
      "description": "API ir duomenų bazės pasiekiamumas. Toliau pateiktas konkretus užklausos ir atsakymo pavyzdys; visi galimi dokumentuoti HTTP kodai išvardyti responses."
      "x-request-example":
        "method": "GET"
        "url": "/health"
      "x-response-example":
        "status": 200
        "body":
          "status": "healthy"
  "/api/auth/register":
    "post":
      "tags":
        - "Auth"
      "summary": "Registracija; nauja paskyra visada turi User rolę"
      "requestBody":
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/RegisterRequest"
            "example":
              "email": "naujas@netscope.local"
              "password": "StiprusSlaptazodis!123"
          "text/json":
            "schema":
              "$ref": "#/components/schemas/RegisterRequest"
          "application/*+json":
            "schema":
              "$ref": "#/components/schemas/RegisterRequest"
        "required": true
      "responses":
        "201":
          "description": "Resursas sukurtas."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/SessionResponse"
              "example":
                "user":
                  "id": "11111111-1111-4111-8111-111111111111"
                  "email": "naujas@netscope.local"
                  "role": "User"
                "expiresAt": "2026-09-26T12:30:00Z"
          "headers":
            "Location":
              "description": "Sukurto resurso kelias."
              "schema":
                "type": "string"
              "example": "/api/auth/me"
        "400":
          "description": "Netinkama užklausa arba filtro / duomenų validacijos klaida."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/ProblemDetails"
              "example":
                "title": "Netinkama užklausa arba filtro / duomenų validacijos klaida."
                "status": 400
        "403":
          "description": "Veiksmui trūksta teisių arba būseną keičiančios užklausos kilmė neleidžiama."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/ProblemDetails"
              "example":
                "title": "Veiksmui trūksta teisių arba būseną keičiančios užklausos kilmė neleidžiama."
                "status": 403
        "409":
          "description": "Dubliuojami duomenys, konkurentinio keitimo konfliktas arba draudžiamas savo paskyros šalinimas."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/ProblemDetails"
              "example":
                "title": "Dubliuojami duomenys, konkurentinio keitimo konfliktas arba draudžiamas savo paskyros šalinimas."
                "status": 409
      "operationId": "postApiAuthRegister"
      "description": "Registracija; nauja paskyra visada turi User rolę. Toliau pateiktas konkretus užklausos ir atsakymo pavyzdys; visi galimi dokumentuoti HTTP kodai išvardyti responses."
      "x-request-example":
        "method": "POST"
        "url": "/api/auth/register"
        "headers":
          "Content-Type": "application/json"
        "body":
          "email": "naujas@netscope.local"
          "password": "StiprusSlaptazodis!123"
      "x-response-example":
        "status": 201
        "headers":
          "Location": "/api/auth/me"
          "Set-Cookie":
            - "netscope_access=<JWT>; HttpOnly; SameSite=Strict; Path=/"
            - "netscope_refresh=<refresh_token>; HttpOnly; SameSite=Strict; Path=/api/auth"
        "body":
          "user":
            "id": "11111111-1111-4111-8111-111111111111"
            "email": "naujas@netscope.local"
            "role": "User"
          "expiresAt": "2026-09-26T12:30:00Z"
  "/api/auth/login":
