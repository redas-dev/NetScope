  "/api/locations/{locationId}/devices/{deviceId}/clients":
    "get":
      "tags":
        - "Clients"
      "summary": "Savo vietos įrenginio klientų sąrašas su paieška ir tipo filtru"
      "parameters":
        -
          "name": "locationId"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
          "example": "22222222-2222-4222-8222-222222222222"
        -
          "name": "deviceId"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "format": "uuid"
          "example": "33333333-3333-4333-8333-333333333333"
        -
          "name": "Search"
          "in": "query"
          "schema":
            "maxLength": 120
            "minLength": 0
            "type": "string"
          "example": "laboratorija"
        -
          "name": "Page"
          "in": "query"
          "schema":
            "maximum": 1000000
            "minimum": 1
            "pattern": "^-?(?:0|[1-9]\\d*)$"
            "type":
              - "integer"
              - "string"
            "format": "int32"
          "example": 1
        -
          "name": "PageSize"
          "in": "query"
          "schema":
            "maximum": 100
            "minimum": 1
            "pattern": "^-?(?:0|[1-9]\\d*)$"
            "type":
              - "integer"
              - "string"
            "format": "int32"
          "example": 20
        -
          "name": "type"
          "in": "query"
          "schema":
            "pattern": "^(Computer|Phone|Tablet|Printer|Other)$"
            "type": "string"
          "example": "Computer"
      "responses":
        "200":
          "description": "Sėkminga užklausa."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/PageResultOfClientResponse"
              "example":
                "items":
                  -
                    "id": "44444444-4444-4444-8444-444444444444"
                    "deviceId": "33333333-3333-4333-8333-333333333333"
                    "name": "Darbo vieta 01"
                    "type": "Computer"
                    "ipAddress": "192.168.10.10"
                    "macAddress": "02:00:00:10:01:01"
                    "links":
                      "self":
                        "href": "/api/locations/22222222-2222-4222-8222-222222222222/devices/33333333-3333-4333-8333-333333333333/clients/44444444-4444-4444-8444-444444444444"
                        "method": "GET"
                      "device":
                        "href": "/api/locations/22222222-2222-4222-8222-222222222222/devices/33333333-3333-4333-8333-333333333333"
                        "method": "GET"
                      "collection":
                        "href": "/api/locations/22222222-2222-4222-8222-222222222222/devices/33333333-3333-4333-8333-333333333333/clients"
                        "method": "GET"
                "total": 1
                "page": 1
                "pageSize": 20
                "links":
                  "self":
                    "href": "/api/locations/22222222-2222-4222-8222-222222222222/devices/33333333-3333-4333-8333-333333333333/clients?page=1&pageSize=20"
                    "method": "GET"
        "400":
          "description": "Netinkama užklausa arba filtro / duomenų validacijos klaida."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/ProblemDetails"
              "example":
                "title": "Netinkama užklausa arba filtro / duomenų validacijos klaida."
                "status": 400
        "401":
