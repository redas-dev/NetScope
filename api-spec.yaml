      "description": "Pakeisti ilgalaikį refresh žetoną ir išduoti naują JWT slapukuose. Toliau pateiktas konkretus užklausos ir atsakymo pavyzdys; visi galimi dokumentuoti HTTP kodai išvardyti responses."
