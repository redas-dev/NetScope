          "description": "Sėkminga užklausa."
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/SessionResponse"
              "example":
                "user":
                  "id": "11111111-1111-4111-8111-111111111111"
                  "email": "redas@netscope.local"
                  "role": "User"
                "expiresAt": "2026-09-26T12:30:00Z"
        "400":
          "description": "Netinkama užklausa arba filtro / duomenų validacijos klaida."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/ProblemDetails"
              "example":
                "title": "Netinkama užklausa arba filtro / duomenų validacijos klaida."
                "status": 400
        "401":
          "description": "Neprisijungta arba prisijungimo / atnaujinimo duomenys negalioja."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/ProblemDetails"
              "example":
                "title": "Neprisijungta arba prisijungimo / atnaujinimo duomenys negalioja."
                "status": 401
        "403":
          "description": "Veiksmui trūksta teisių arba būseną keičiančios užklausos kilmė neleidžiama."
          "content":
            "application/problem+json":
              "schema":
                "$ref": "#/components/schemas/ProblemDetails"
              "example":
                "title": "Veiksmui trūksta teisių arba būseną keičiančios užklausos kilmė neleidžiama."
                "status": 403
      "operationId": "postApiAuthLogin"
      "description": "Prisijungti ir gauti JWT su naudotojo role. Toliau pateiktas konkretus užklausos ir atsakymo pavyzdys; visi galimi dokumentuoti HTTP kodai išvardyti responses."
      "x-request-example":
        "method": "POST"
        "url": "/api/auth/login"
        "headers":
          "Content-Type": "application/json"
        "body":
          "email": "redas@netscope.local"
          "password": "NetScopeDemo!2026"
      "x-response-example":
        "status": 200
        "headers":
          "Set-Cookie":
            - "netscope_access=<JWT>; HttpOnly; SameSite=Strict; Path=/"
            - "netscope_refresh=<refresh_token>; HttpOnly; SameSite=Strict; Path=/api/auth"
        "body":
          "user":
            "id": "11111111-1111-4111-8111-111111111111"
            "email": "redas@netscope.local"
            "role": "User"
          "expiresAt": "2026-09-26T12:30:00Z"
